name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # monaco-editor 0.56 (and the modernized toolchain: jest 30, eslint 8 with
        # a TypeScript 5 parser) no longer support the older runtimes this matrix
        # used to cover, and `engines` now requires >=24.
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  # The example consumes the built package via `file:../`, so it is the only
  # check that exercises the published entry points and the monaco-editor peer
  # dependency the way a real consumer would. The publish workflow builds it to
  # deploy GitHub Pages, and without this job a break there is only discovered
  # during a release.
  example:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: install example dependencies
        working-directory: ./example
        run: yarn install --frozen-lockfile

      # react-scripts runs eslint as part of the production build, so this
      # covers both linting and compilation of the example.
      - name: build example site
        working-directory: ./example
        run: yarn build
