name: Publish

permissions:
  contents: write
  # required for npm trusted publishing (OIDC)
  id-token: write

on:
  release:
      types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # npm trusted publishing requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: yarn
      - run: yarn build

      - run: yarn version --no-git-tag-version --new-version ${{ github.event.release.name }}

      - name: Publish to npm (trusted publishing)
        run: npm publish

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: ${{ secrets.PRIVATE_REGISTRY }}

      - name: Publish to private registry
        run: yarn publish --non-interactive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: install example dependencies
        working-directory: ./example
        run: yarn

      - name: build example site
        working-directory: ./example
        run: yarn build
        env:
          PUBLIC_URL: '/monaco-sql-languages'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build
