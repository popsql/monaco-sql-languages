name: Publish

permissions:
  contents: write
  # required for npm trusted publishing (OIDC)
  id-token: write

on:
  release:
      types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # npm trusted publishing requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: yarn
      - run: yarn build

      - run: yarn version --no-git-tag-version --new-version ${{ github.event.release.name }}

      - name: Determine npm dist-tag
        id: determine_dist_tag
        # A prerelease version (anything with a `-` suffix, e.g. 0.4.0-pre.0) must
        # not land on `latest`, and npm >= 11 refuses to publish one without an
        # explicit --tag. Derive the dist-tag from the version itself so the
        # GitHub release "prerelease" checkbox can't disagree with the package.
        env:
          RELEASE_VERSION: ${{ github.event.release.name }}
        run: |
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing)
        run: npm publish --tag ${{ steps.determine_dist_tag.outputs.dist_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: ${{ secrets.PRIVATE_REGISTRY }}

      - name: Publish to private registry
        run: yarn publish --non-interactive --tag ${{ steps.determine_dist_tag.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      # Point the registry back at the public npm registry for the example install.
      # `setup-node` exports NPM_CONFIG_USERCONFIG for the remainder of the job when
      # `registry-url` is given, and it never unsets it, so a bare `setup-node` here
      # would leave the private registry in effect. Passing an explicit `registry-url`
      # rewrites that same .npmrc with the public registry instead.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: install example dependencies
        working-directory: ./example
        run: yarn

      - name: build example site
        working-directory: ./example
        run: yarn build
        env:
          PUBLIC_URL: '/monaco-sql-languages'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build
